                    <i class="fa-brands fa-whatsapp text-lg"></i>
                    <span>SEND VIA WHATSAPP</span>

                <div class="grid grid-cols-2 gap-2">
                    <button onclick="copySummaryText()" class="bg-white hover:bg-slate-100 active:scale-[0.98] text-slate-700 border border-slate-300 font-bold py-2.5 px-3 rounded-xl text-xs flex items-center justify-center gap-1.5 transition-all">
                        <i class="fa-regular fa-copy"></i>
                        <span>Copy Order</span>

                    <button onclick="shareNative()" class="bg-white hover:bg-slate-100 active:scale-[0.98] text-slate-700 border border-slate-300 font-bold py-2.5 px-3 rounded-xl text-xs flex items-center justify-center gap-1.5 transition-all">
                        <i class="fa-solid fa-share-nodes"></i>

    <!-- Application Logic -->
    <script>
        /**
         * Product Catalog Database
         */
        const PRODUCT_CATALOG = [
            {
                category: "SKRETTING",
                icon: "fa-fish",
                items: [
                    { id: "skret-perla-1", name: "Perla Larva 1kg", price: 13000, weight: 1 },
                    { id: "skret-05mm-5", name: "0.5mm SKRET (Catfish Feed 0.5mm-0.7mm 5kg)", price: 50000, weight: 5 },
                    { id: "skret-10mm-5", name: "1.0mm SKRET (Catfish Feed 1.0mm 5kg)", price: 33500, weight: 5 },
                    { id: "skret-18mm-5", name: "1.8mm SKRET (Catfish Feed 1.8mm 5kg)", price: 22000, weight: 5 },
                    { id: "skret-20mm-15", name: "2.0mm SKRET (Catfish Feed 2.0mm)", price: 31200, weight: 15 }
                ]
            },
            {
                category: "SUPERIOR",
                icon: "fa-award",
                items: [
                    { id: "sup-30mm-15", name: "3.0mm SUPERIOR (Catfish Feed 3.0mm)", price: 25800, weight: 15 },
                    { id: "sup-45mm-15", name: "4.5mm SUPERIOR (Catfish Feed 4.5mm Sup)", price: 24000, weight: 15 },
                    { id: "sup-60mm-15", name: "6.0mm SUPERIOR (Catfish Feed 6.0mm Sup)", price: 24000, weight: 15 },
                    { id: "sup-80mm-15", name: "8.0mm SUPERIOR (Catfish Feed 8.0mm Sup)", price: 24000, weight: 15 }
                ]
            },
            {
                category: "ESSENTIAL",
                icon: "fa-shield-halved",
                items: [
                    { id: "ess-30mm-15", name: "3.0mm ESSENTIAL (Catfish Feed 3.0mm Ess)", price: 24750, weight: 15 },
                    { id: "ess-45mm-15", name: "4.5mm ESSENTIAL (Catfish Feed 4.5mm Ess)", price: 22650, weight: 15 },
                    { id: "ess-60mm-15", name: "6.0mm ESSENTIAL (Catfish Feed 6.0mm Ess)", price: 21150, weight: 15 },
                    { id: "ess-80mm-15", name: "8.0mm ESSENTIAL (Catfish Feed 8.0mm Ess)", price: 19650, weight: 15 }
                ]
            },
            {
                category: "REPRO",
                icon: "fa-dna",
                items: [
                    { id: "repro-80mm-15", name: "8.0mm Repro", price: 27750, weight: 15 }
                ]
            },
            {
                category: "ADDITIVES",
                icon: "fa-flask",
                items: [
                    { id: "add-selko-25", name: "Selko pH", price: 101250, weight: 25 },
                    { id: "add-aquacare-1", name: "Aqua Care", price: 47500, weight: 1 }
                ]
            },
            {
                category: "HENDRIX PRO",
                icon: "fa-feather",
                items: [
                    { id: "hen-prestar-25", name: "Prestarter 25kg", price: 24750, weight: 25 },
                    { id: "hen-bstarter-25", name: "BStarter Pro 25kg (Broiler Starter 25kg)", price: 23750, weight: 25 },
                    { id: "hen-bgrower-25", name: "BGrower Pro 25kg", price: 18750, weight: 25 },
                    { id: "hen-bfinish-25", name: "BFinisher Pro 25kg (Broiler Finisher 25kg)", price: 23250, weight: 25 }
                ]
            },
            {
                category: "HENDRIX ESSENTIAL",
                icon: "fa-egg",
                items: [
                    { id: "hen-bstart-ess-25", name: "BStarter Ess 25kg (Broiler Starter Ess 25kg)", price: 21500, weight: 25 },
                    { id: "hen-bgrow-ess-25", name: "BGrower Ess 25kg (Broiler Grower Ess 25kg)", price: 18250, weight: 25 },
                    { id: "hen-bfin-ess-25", name: "BFinisher Ess 25kg (Broiler Finisher Ess 25kg)", price: 19500, weight: 25 }
                ]
            },
            {
                category: "CONCENTRATE (5% CCT)",
                icon: "fa-boxes-packing",
                items: [
                    { id: "cct-layer-prod-50", name: "Layer Prod CCT 5%", price: 111000, weight: 50 },
                    { id: "cct-layer-rear-50", name: "Layer Rearer CCT 5%", price: 93500, weight: 50 },
                    { id: "cct-broil-start-50", name: "Broiler Starter CCT 5%", price: 135000, weight: 50 },
                    { id: "cct-broil-finish-50", name: "Broiler Finisher CCT 5%", price: 131500, weight: 50 },
                    { id: "cct-breeder-50", name: "Breeder CCT 5%", price: 111000, weight: 50 }
                ]
            },
            {
                category: "MASH",
                icon: "fa-wheat-awn",
                items: [
                    { id: "mash-layer-25", name: "Layer Mash 25kg", price: 13000, weight: 25 },
                    { id: "mash-grower-25", name: "Grower Mash 25kg", price: 12900, weight: 25 }
                ]
            }
        ];

        // State variables
        let orderState = {};
        let activeCategory = "ALL";
        let searchQuery = "";

        // Application initialization
        window.addEventListener('DOMContentLoaded', () => {
            loadState();
            renderCategoryTabs();
            renderProducts();
            updateTotals();
        });

        // Load persisted local storage
        function loadState() {
            try {
                const savedOrder = localStorage.getItem('fo_order_state');
                const savedName = localStorage.getItem('fo_customer_name');
                if (savedOrder) orderState = JSON.parse(savedOrder);
                if (savedName) {
                    document.getElementById('customerName').value = savedName;
                }
            } catch (e) {
                console.error("Storage load error:", e);
                orderState = {};
            }
        }

        // Save local state
        function saveState() {
            try {
                localStorage.setItem('fo_order_state', JSON.stringify(orderState));
            } catch (e) {
                console.error("Failed to save state:", e);
            }
        }

        function handleCustomerInput(input) {
            input.value = input.value.toUpperCase();
            localStorage.setItem('fo_customer_name', input.value);
        }

        // Render Category Tabs
        function renderCategoryTabs() {
            const tabsContainer = document.getElementById('categoryTabs');
            let html = `
                <button onclick="setCategory('ALL')" 
                    class="tab-btn text-xs px-3 py-1.5 rounded-xl font-bold transition-all border border-slate-200 bg-white text-slate-600 shrink-0 ${activeCategory === 'ALL' ? 'tab-active' : ''}">
                    ALL
                </button>
            `;

            PRODUCT_CATALOG.forEach(cat => {
                const isActive = activeCategory === cat.category;
                html += `
                    <button onclick="setCategory('${cat.category}')" 
                        class="tab-btn text-xs px-3 py-1.5 rounded-xl font-semibold transition-all border border-slate-200 bg-white text-slate-600 shrink-0 flex items-center gap-1.5 ${isActive ? 'tab-active' : ''}">
                        <i class="fa-solid ${cat.icon} text-[10px]"></i>
                        <span>${cat.category}</span>
                    </button>
                `;
            });

            tabsContainer.innerHTML = html;
        }

        function setCategory(cat) {
            activeCategory = cat;
            renderCategoryTabs();
            renderProducts();
        }

        function handleSearch(val) {
            searchQuery = val.trim().toLowerCase();
            document.getElementById('clearSearchBtn').classList.toggle('hidden', searchQuery === "");
            renderProducts();
        }

        function clearSearch() {
            document.getElementById('searchInput').value = "";
            searchQuery = "";
            document.getElementById('clearSearchBtn').classList.add('hidden');
            renderProducts();
        }

        // Render Product Lists
        function renderProducts() {
            const container = document.getElementById('productContainer');
            let html = "";

            PRODUCT_CATALOG.forEach(cat => {
                if (activeCategory !== "ALL" && activeCategory !== cat.category) return;

                const filteredItems = cat.items.filter(item => 
                    item.name.toLowerCase().includes(searchQuery) || 
                    cat.category.toLowerCase().includes(searchQuery)
                );

                if (filteredItems.length === 0) return;

                html += `
                    <div class="glass-card rounded-2xl p-3.5 shadow-sm border border-slate-200/80">
                        <div class="flex items-center gap-2 mb-3 pb-2 border-b border-slate-100">
                            <i class="fa-solid ${cat.icon} text-green-600 text-sm"></i>
                            <h2 class="font-black text-xs text-slate-800 uppercase tracking-wider">${cat.category}</h2>
                        </div>
                        <div class="space-y-3">
                `;

                filteredItems.forEach(item => {
                    const qty = orderState[item.id] || 0;
                    const itemTotal = qty * item.price;
                    const itemWeight = qty * item.weight;

                    html += `
                        <div class="product-item flex flex-col sm:flex-row sm:items-center justify-between gap-2.5 p-2 rounded-xl transition-all ${qty > 0 ? 'bg-green-50/60 border border-green-200' : 'hover:bg-slate-50'}" id="item-card-${item.id}">
                            <div class="flex-1 min-w-0">
                                <div class="font-bold text-slate-900 text-sm leading-snug truncate">${item.name}</div>
                                <div class="text-xs text-slate-500 font-medium mt-0.5">
                                    ₦${item.price.toLocaleString()} <span class="text-slate-400">/ bag (${item.weight}kg)</span>
                                </div>
                            </div>

                            <div class="flex items-center justify-between sm:justify-end gap-3">
                                <!-- Row output for weight & subtotal -->
                                <div class="text-left sm:text-right min-w-[95px]">
                                    ${qty > 0 ? `
                                        <div class="text-xs font-black text-slate-900">₦${itemTotal.toLocaleString()}</div>
                                        <div class="text-[10px] font-bold text-emerald-600">${itemWeight} kg</div>
                                    ` : `
                                        <div class="text-[11px] font-medium text-slate-400">Qty: 0</div>
                                    `}
                                </div>

                                <!-- Touch Stepper controls -->
                                <div class="flex items-center bg-slate-100 border border-slate-200 rounded-xl p-1 shadow-inner">
                                    <button onclick="adjustQty('${item.id}', -1)" class="w-8 h-8 rounded-lg bg-white active:bg-slate-200 text-slate-700 font-bold flex items-center justify-center shadow-sm active:scale-90 transition-all">
                                        <i class="fa-solid fa-minus text-xs"></i>
                                    </button>
                                    
                                    <input type="number" 
                                        id="input-${item.id}"
                                        value="${qty || ''}" 
                                        placeholder="0"
                                        min="0"
                                        oninput="setQty('${item.id}', this.value)"
                                        class="w-11 text-center bg-transparent font-black text-slate-900 text-sm outline-none">

                                    <button onclick="adjustQty('${item.id}', 1)" class="w-8 h-8 rounded-lg bg-green-600 active:bg-green-700 text-white font-bold flex items-center justify-center shadow-sm active:scale-90 transition-all">
                                        <i class="fa-solid fa-plus text-xs"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                });

                html += `
                        </div>
                    </div>
                `;
            });

            if (html === "") {
                html = `
                    <div class="text-center py-12 glass-card rounded-2xl border border-slate-200">
                        <i class="fa-solid fa-box-open text-3xl text-slate-300 mb-2"></i>
                        <p class="text-slate-500 font-medium text-sm">No matching products found</p>
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        // Adjust quantity via stepper
        function adjustQty(id, delta) {
            const current = orderState[id] || 0;
            const updated = Math.max(0, current + delta);
            if (updated === 0) {
                delete orderState[id];
            } else {
                orderState[id] = updated;
            }
            saveState();
            updateItemUI(id);
            updateTotals();
        }

        // Set quantity directly
        function setQty(id, val) {
            const parsed = parseInt(val, 10);
            if (isNaN(parsed) || parsed <= 0) {
                delete orderState[id];
            } else {
                orderState[id] = parsed;
            }
            saveState();
            updateItemUI(id);
            updateTotals();
        }

        // Fast DOM updates without redrawing entire list
        function updateItemUI(id) {
            const input = document.getElementById(`input-${id}`);
            const card = document.getElementById(`item-card-${id}`);
            const qty = orderState[id] || 0;
            
            if (input && input.value != qty) {
                input.value = qty || '';
            }

            const itemObj = findProductById(id);
            if (itemObj && card) {
                const itemTotal = qty * itemObj.price;
                const itemWeight = qty * itemObj.weight;
                
                card.className = `product-item flex flex-col sm:flex-row sm:items-center justify-between gap-2.5 p-2 rounded-xl transition-all ${qty > 0 ? 'bg-green-50/60 border border-green-200' : 'hover:bg-slate-50'}`;
                
                const previewContainer = card.querySelector('.min-w-\\[95px\\]');
                if (previewContainer) {
                    previewContainer.innerHTML = qty > 0 ? `
                        <div class="text-xs font-black text-slate-900">₦${itemTotal.toLocaleString()}</div>
                        <div class="text-[10px] font-bold text-emerald-600">${itemWeight} kg</div>
                    ` : `
                        <div class="text-[11px] font-medium text-slate-400">Qty: 0</div>
                    `;
                }
            }
        }

        function findProductById(id) {
            for (const cat of PRODUCT_CATALOG) {
                for (const item of cat.items) {
                    if (item.id === id) return item;
                }
            }
            return null;
        }

        // Update overall order sums
        function updateTotals() {
            let totalBags = 0;
            let totalWeight = 0;
            let grandTotal = 0;

            Object.entries(orderState).forEach(([id, qty]) => {
                const item = findProductById(id);
                if (item && qty > 0) {
                    totalBags += qty;
                    totalWeight += (qty * item.weight);
                    grandTotal += (qty * item.price);
                }
            });

            document.getElementById('barTotalBags').innerText = totalBags.toLocaleString();
            document.getElementById('barTotalWeight').innerText = totalWeight.toLocaleString();
            document.getElementById('barGrandTotal').innerText = grandTotal.toLocaleString();
        }

        // Summary Modal Handling
        function openSummaryModal() {
            const modal = document.getElementById('summaryModal');
            const tbody = document.getElementById('modalTableBody');
            const emptyMsg = document.getElementById('modalEmptyMsg');
            const custInput = document.getElementById('customerName').value.trim();

            document.getElementById('modalCustomerName').innerText = custInput ? custInput.toUpperCase() : "UNSPECIFIED";
            document.getElementById('modalDate').innerText = new Date().toLocaleDateString('en-GB');

            let totalBags = 0;
            let totalWeight = 0;
            let grandTotal = 0;
            let rowsHtml = "";

            Object.entries(orderState).forEach(([id, qty]) => {
                const item = findProductById(id);
                if (item && qty > 0) {
                    const subtotal = qty * item.price;
                    const weight = qty * item.weight;

                    totalBags += qty;
                    totalWeight += weight;
                    grandTotal += subtotal;

                    rowsHtml += `
                        <tr>
                            <td class="p-2.5">
                                <div class="font-bold text-slate-900">${item.name}</div>
                                <div class="text-[10px] text-slate-400 font-medium">${weight} kg total weight</div>
                            </td>
                            <td class="p-2.5 text-center font-semibold text-slate-700">
                                ₦${item.price.toLocaleString()} × ${qty}
                            </td>
                            <td class="p-2.5 text-right font-black text-slate-900">
                                ₦${subtotal.toLocaleString()}
                            </td>
                        </tr>
                    `;
                }
            });

            if (totalBags === 0) {
                tbody.innerHTML = "";
                emptyMsg.classList.remove('hidden');
            } else {
                emptyMsg.classList.add('hidden');
                tbody.innerHTML = rowsHtml;
            }

            document.getElementById('modalTotalBags').innerText = totalBags.toLocaleString();
            document.getElementById('modalTotalWeight').innerText = totalWeight.toLocaleString();
            document.getElementById('modalGrandTotal').innerText = grandTotal.toLocaleString();

            modal.classList.remove('hidden');
        }

        function closeSummaryModal() {
            document.getElementById('summaryModal').classList.add('hidden');
        }

        // WhatsApp-compliant text string formatting
        function generateOrderText() {
            const name = document.getElementById('customerName').value.trim().toUpperCase() || "N/A";
            let text = `*ORDER DETAILS*\n`;
            text += `*CUSTOMER: ${name}*\n`;
            text += `--------------------------------\n`;

            let totalBags = 0;
            let totalWeight = 0;
            let grandTotal = 0;

            Object.entries(orderState).forEach(([id, qty]) => {
                const item = findProductById(id);
                if (item && qty > 0) {
                    const subtotal = qty * item.price;
                    const weight = qty * item.weight;
                    totalBags += qty;
                    totalWeight += weight;
                    grandTotal += subtotal;

                    text += `• ${item.name}\n  ₦${item.price.toLocaleString()} x ${qty} = ₦${subtotal.toLocaleString()} (${weight}kg)\n`;
                }
            });

            text += `--------------------------------\n`;
            text += `*TOTAL BAGS:* ${totalBags} bags\n`;
            text += `*TOTAL WEIGHT:* ${totalWeight} kg\n`;
            text += `*GRAND TOTAL:* ₦${grandTotal.toLocaleString()}\n`;

            return text;
        }

        // WhatsApp Share Trigger
        function sendWhatsApp() {
            const text = generateOrderText();
            const url = `https://wa.me/?text=${encodeURIComponent(text)}`;
            window.open(url, '_blank');
        }

        // Copy summary clipboard action
        function copySummaryText() {
            const text = generateOrderText();
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast("Order copied to clipboard!");
                });
            } else {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    showToast("Order copied to clipboard!");
                } catch (err) {
                    showToast("Failed to copy", true);
                }
                document.body.removeChild(textArea);
            }
        }

        // Native share sheet fallback
        function shareNative() {
            const text = generateOrderText();
            if (navigator.share) {
                navigator.share({
                    title: 'Factoryorder Summary',
                    text: text
                }).catch(() => {});
            } else {
                copySummaryText();
            }
        }

        // Reset Order State
        function confirmReset() {
            if (confirm("Are you sure you want to clear all items and reset the order?")) {
                orderState = {};
                document.getElementById('customerName').value = "";
                localStorage.removeItem('fo_order_state');
                localStorage.removeItem('fo_customer_name');
                renderProducts();
                updateTotals();
                showToast("Order reset successfully");
            }
        }

        // Toast message banner
        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');

            toastMsg.innerText = msg;
            toastIcon.className = isError ? "fa-solid fa-circle-exclamation text-rose-400" : "fa-solid fa-circle-check text-green-400";

            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }
    </script>
</body>
</html>
