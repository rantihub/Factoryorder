<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factoryorder | Order Manager</title>
    <style>
        :root { 
            --primary: #2c3e50; 
            --primary-light: #34495e;
            --accent: #27ae60; 
            --accent-light: #2ecc71;
            --danger: #e74c3c;
            --bg: #f5f7fa; 
            --white: #ffffff; 
            --text-main: #2d3436;
            --text-muted: #7f8c8d;
            --border: #edf2f7;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg); 
            margin: 0; 
            padding: 0;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
            padding: 16px 16px 140px 16px;
        }

        header { 
            background: linear-gradient(135deg, var(--primary), var(--primary-light)); 
            color: white; 
            padding: 20px 16px; 
            text-align: center; 
            border-radius: 12px; 
            margin-bottom: 16px; 
            box-shadow: 0 4px 12px rgba(44, 62, 80, 0.12);
        }

        header h1 {
            margin: 0;
            font-size: 1.6rem;
            letter-spacing: 0.5px;
            font-weight: 700;
        }

        .customer-section { 
            background: var(--white); 
            padding: 16px; 
            border-radius: 12px; 
            margin-bottom: 20px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.04); 
            position: relative;
        }

        .customer-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .customer-input { 
            width: 100%; 
            padding: 14px 40px 14px 16px; 
            border: 2px solid #e2e8f0; 
            border-radius: 8px; 
            font-size: 1.1rem; 
            font-weight: 700; 
            text-transform: uppercase; 
            text-align: center; 
            box-sizing: border-box; 
            transition: all 0.2s ease;
            color: var(--primary);
            background: #f8fafc;
        }

        .customer-input:focus {
            border-color: var(--primary);
            background: var(--white);
            outline: none;
            box-shadow: 0 0 0 3px rgba(44, 62, 80, 0.1);
        }

        .clear-btn {
            position: absolute;
            right: 12px;
            background: #cbd5e1;
            color: white;
            border: none;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .category-card { 
            background: var(--white); 
            border-radius: 12px; 
            padding: 18px; 
            margin-bottom: 16px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.04); 
            border: 1px solid var(--border);
        }
        
        h3 { 
            margin: 0 0 14px 0; 
            color: var(--primary); 
            font-size: 0.95rem; 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
            font-weight: 700;
            border-left: 4px solid var(--accent);
            padding-left: 8px;
        }
        
        .product-row { 
            display: grid; 
            grid-template-columns: 1fr 100px; 
            gap: 12px; 
            align-items: center; 
            padding: 12px 0; 
            border-bottom: 1px solid var(--border); 
            transition: all 0.2s ease;
        }

        .product-row.active-row {
            background-color: #f0fff4;
            margin: 0 -10px;
            padding: 12px 10px;
            border-radius: 6px;
        }
        
        .product-row:last-child { border-bottom: none; }
        
        .product-info { 
            font-weight: 600; 
            font-size: 0.9rem; 
            line-height: 1.4;
        }
        
        .product-meta { 
            font-size: 0.75rem; 
            color: var(--text-muted); 
            font-weight: normal; 
            margin-top: 2px;
            display: block;
        }
        
        .qty-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        input[type="number"] { 
            width: 100%; 
            padding: 10px; 
            border: 1px solid #cbd5e1; 
            border-radius: 8px; 
            font-size: 1.05rem; 
            font-weight: 600;
            text-align: center; 
            box-sizing: border-box; 
            -moz-appearance: textfield;
            transition: all 0.2s;
        }

        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="number"]:focus {
            border-color: var(--accent);
            outline: none;
            background: #fff;
        }
        
        .row-totals { 
            grid-column: span 2; 
            font-size: 0.8rem; 
            color: var(--accent); 
            font-weight: 700; 
            text-align: right; 
            margin-top: 2px;
        }
        
        .summary-panel { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            right: 0; 
            background: rgba(44, 62, 80, 0.96); 
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: white; 
            padding: 16px 24px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            z-index: 100; 
            box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
        }

        .summary-total-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #b2bec3;
            margin-bottom: 2px;
        }

        .summary-total-value {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--accent-light);
        }
        
        .summary-btn { 
            background: var(--accent); 
            color: white; 
            border: none; 
            padding: 14px 24px; 
            border-radius: 8px; 
            font-weight: 700; 
            font-size: 0.95rem;
            cursor: pointer; 
            transition: background 0.2s;
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.3);
        }

        .summary-btn:hover { background: var(--accent-light); }
        
        #reportModal { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0, 0, 0, 0.6); 
            backdrop-filter: blur(4px);
            z-index: 1000; 
            overflow-y: auto; 
            padding: 16px; 
            box-sizing: border-box; 
        }
        
        .modal-content { 
            background: white; 
            padding: 24px; 
            border-radius: 16px; 
            max-width: 550px; 
            margin: 20px auto; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border);
            padding-bottom: 12px;
            margin-bottom: 16px;
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--primary);
            margin: 0;
        }

        .modal-close-x {
            font-size: 28px;
            cursor: pointer;
            color: var(--text-muted);
            line-height: 1;
        }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            font-size: 0.85rem; 
            margin-top: 12px; 
        }
        
        th, td { 
            text-align: left; 
            padding: 10px 8px; 
            border-bottom: 1px solid var(--border); 
        }
        
        th { 
            background: #f8fafc; 
            color: var(--primary);
            font-weight: 700;
        }
        
        .invoice-totals {
            margin-top: 16px;
            padding: 14px;
            background: #f8fafc;
            border-radius: 8px;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .bank-details { 
            background: #fffdf5; 
            border: 1px solid #fef08a;
            border-left: 4px solid #f59e0b; 
            padding: 12px; 
            margin-top: 16px; 
            border-radius: 6px;
            font-size: 0.85rem; 
            line-height: 1.5;
        }
        
        .btn-block {
            display: block;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            margin-top: 12px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            box-sizing: border-box;
        }

        .pdf-btn { background: #3498db; color: white; box-shadow: 0 4px 10px rgba(52, 152, 219, 0.2); }
        .pdf-btn:hover { background: #2980b9; }
        .whatsapp-btn { background: #25D366; color: white; box-shadow: 0 4px 10px rgba(37, 211, 102, 0.2); }
        .whatsapp-btn:hover { background: #20ba5a; }
        .reset-btn { background: transparent; color: var(--danger); font-size: 0.9rem; }
        .reset-btn:hover { background: #fff5f5; }

        /* Print Media Styles to handle pristine PDF Layouts */
        @media print {
            body { background: white; color: black; padding: 0; }
            .container, .summary-panel, .whatsapp-btn, .pdf-btn, .reset-btn, .modal-close-x, .close-btn { display: none !important; }
            #reportModal { display: block !important; position: relative; background: none; width: 100%; height: auto; padding: 0; }
            .modal-content { max-width: 100%; padding: 0; border: none; box-shadow: none; margin: 0; }
            table { width: 100%; font-size: 0.9rem; }
            th { background: #e2e8f0 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .bank-details { border: 1px solid #cbd5e1; background: #f8fafc; }
        }
    </style>
</head>
<body>

<div class="container">
    <header><h1>Factoryorder</h1></header>

    <div class="customer-section">
        <div class="customer-input-wrapper">
            <input type="text" id="customer-name" class="customer-input" placeholder="CUSTOMER NAME" oninput="saveCustomer(this.value)">
            <button class="clear-btn" onclick="clearCustomer()">×</button>
        </div>
    </div>

    <div id="app"></div>
</div>

<div class="summary-panel">
    <div>
        <div class="summary-total-label">Total Order Value</div>
        <div class="summary-total-value">₦<span id="grand-value">0</span></div>
    </div>
    <button class="summary-btn" onclick="showSummary()">VIEW SUMMARY</button>
</div>

<div id="reportModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 class="modal-title">ORDER SUMMARY</h2>
            <span class="modal-close-x" onclick="closeModal()">&times;</span>
        </div>
        
        <div id="modal-body"></div>
        
        <div class="bank-details">
            <strong style="color: #b45309;">PAYMENT ACCOUNT DETAILS:</strong><br>
            Bank: <strong>Firstbank</strong><br>
            Account Name: <strong>Skretting Nigeria Ltd</strong><br>
            Account Number: <strong style="font-size: 1rem; color: var(--primary);">2025573747</strong>
        </div>

        <button class="btn-block pdf-btn" onclick="exportPDF()">EXPORT AS PDF / PRINT</button>
        <button class="btn-block whatsapp-btn" onclick="sendWhatsApp()">SEND VIA WHATSAPP</button>
        <button class="btn-block reset-btn" onclick="resetData()">Clear & Reset Order Sheet</button>
    </div>
</div>

<script>
    const dataStructure = [
        { cat: "SKRETTING", items: [
            { name: "Perla Larva", price: 13000, w: 1 },
            { name: "0.5mm SKRET", price: 50000, w: 5 },
            { name: "1.0mm SKRET", price: 32500, w: 5 },
            { name: "1.8mm SKRET", price: 21000, w: 5 },
            { name: "2.0mm SKRET", price: 29700, w: 15 }
        ]},
        { cat: "SUPERIOR", items: [
            { name: "3.0mm SUPERIOR", price: 24300, w: 15 },
            { name: "4.5mm SUPERIOR", price: 22200, w: 15 },
            { name: "6.0mm SUPERIOR", price: 22200, w: 15 },
            { name: "8.0mm SUPERIOR", price: 22200, w: 15 }
        ]},
        { cat: "ESSENTIAL", items: [
            { name: "3.0mm ESSENTIAL", price: 23250, w: 15 },
            { name: "4.5mm ESSENTIAL", price: 21150, w: 15 },
            { name: "6.0mm ESSENTIAL", price: 19650, w: 15 },
            { name: "8.0mm ESSENTIAL", price: 18150, w: 15 }
        ]},
        { cat: "REPRO", items: [ { name: "8.0mm Repro", price: 27000, w: 15 } ]},
        { cat: "ADDITIVES", items: [
            { name: "Selko pH", price: 100000, w: 25 },
            { name: "Aqua Care", price: 47500, w: 1 }
        ]},
        { cat: "HENDRIX PRO", items: [
            { name: "Prestarter", price: 20500, w: 25 },
            { name: "BStarter Pro", price: 19250, w: 25 },
            { name: "BGrower Pro", price: 18750, w: 25 },
            { name: "BFinisher Pro", price: 18750, w: 25 }
        ]},
        { cat: "HENDRIX ESSENTIAL", items: [
            { name: "BStarter Ess", price: 16500, w: 25 },
            { name: "BFinisher Ess", price: 16000, w: 25 }
        ]},
        { cat: "CONCENTRATE", items: [
            { name: "Layer Prod CCT", price: 80000, w: 50 },
            { name: "Layer Rearer CCT", price: 77500, w: 50 },
            { name: "Broiler Starter CCT", price: 95000, w: 50 },
            { name: "Broiler Finisher CCT", price: 92500, w: 50 },
            { name: "Breeder CCT", price: 85000, w: 50 }
        ]},
        { cat: "MASH", items: [
            { name: "Layer Mash", price: 13000, w: 25 },
            { name: "Grower Mash", price: 12900, w: 25 }
        ]}
    ];

    let state = JSON.parse(localStorage.getItem('factoryOrderData')) || {};
    let customerName = localStorage.getItem('factoryCustomerName') || '';

    function init() {
        const app = document.getElementById('app');
        document.getElementById('customer-name').value = customerName;
        let html = '';
        dataStructure.forEach(group => {
            html += `<div class="category-card"><h3>${group.cat}</h3>`;
            group.items.forEach(item => {
                const id = item.name.replace(/\s+/g, '-');
                const qty = state[id] || '';
                const isActive = qty > 0 ? 'active-row' : '';
                html += `
                    <div class="product-row ${isActive}" id="row-${id}">
                        <div class="product-info">${item.name}<br><span class="product-meta">₦${item.price.toLocaleString()} (${item.w}kg)</span></div>
                        <div class="qty-wrapper">
                            <input type="number" id="input-${id}" placeholder="0" value="${qty}" oninput="update('${id}', this.value)">
                        </div>
                        <div class="row-totals" id="total-${id}">${qty > 0 ? (qty * item.w) + 'kg | ₦' + (qty * item.price).toLocaleString() : ''}</div>
                    </div>`;
            });
            html += `</div>`;
        });
        app.innerHTML = html;
        calculateGrandTotals();
    }

    function saveCustomer(val) { customerName = val.toUpperCase(); localStorage.setItem('factoryCustomerName', customerName); }
    function clearCustomer() { document.getElementById('customer-name').value = ''; customerName = ''; localStorage.setItem('factoryCustomerName', ''); }
    function findItem(id) { for (const g of dataStructure) { for (const i of g.items) { if (i.name.replace(/\s+/g, '-') === id) return i; } } }

    function update(id, value) {
        const qty = parseInt(value) || 0;
        const row = document.getElementById(`row-${id}`);
        
        if (qty <= 0) {
            delete state[id];
            if(row) row.classList.remove('active-row');
        } else {
            state[id] = qty;
            if(row) row.classList.add('active-row');
        }
        
        localStorage.setItem('factoryOrderData', JSON.stringify(state));
        const item = findItem(id);
        document.getElementById(`total-${id}`).innerText = qty > 0 ? `${qty * item.w}kg | ₦${(qty * item.price).toLocaleString()}` : '';
        calculateGrandTotals();
    }

    function calculateGrandTotals() {
        let totalVal = 0;
        for (const [id, qty] of Object.entries(state)) { const item = findItem(id); if (item) totalVal += (qty * item.price); }
        document.getElementById('grand-value').innerText = totalVal.toLocaleString();
    }

    function showSummary() {
        const body = document.getElementById('modal-body');
        let totalW = 0, totalV = 0, totalQ = 0;
        let tableHtml = `<div style="padding: 8px 0; font-size: 1rem; color: var(--primary);"><strong>CUSTOMER:</strong> ${customerName || 'CASH CUSTOMER'}</div>`;
        tableHtml += `<table><thead><tr><th>Category</th><th>Item (Type)</th><th>Qty</th><th>Price</th><th>Amount</th></tr></thead><tbody>`;
        
        dataStructure.forEach(group => {
            group.items.forEach(item => {
                const id = item.name.replace(/\s+/g, '-');
                const qty = state[id] || 0;
                if (qty > 0) {
                    const w = qty * item.w;
                    const v = qty * item.price;
                    totalW += w; totalV += v; totalQ += qty;
                    tableHtml += `<tr>
                        <td><strong>${group.cat}</strong></td>
                        <td>${item.name} (${item.w}kg)</td>
                        <td>${qty}</td>
                        <td>₦${item.price.toLocaleString()}</td>
                        <td>₦${v.toLocaleString()}</td>
                    </tr>`;
                }
            });
        });
        
        tableHtml += `</tbody></table><div class="invoice-totals">`;
        tableHtml += `Total Bags: <strong>${totalQ}</strong><br>`;
        tableHtml += `Total Weight: <strong>${totalW.toLocaleString()} kg</strong><br>`;
        tableHtml += `<div style="font-size: 1.1rem; color: var(--accent); margin-top: 6px; border-top: 1px dashed #cbd5e1; padding-top: 6px;"><strong>Net Payable Amount: ₦${totalV.toLocaleString()}</strong></div></div>`;
        body.innerHTML = tableHtml;
        document.getElementById('reportModal').style.display = 'block';
    }

    function exportPDF() { window.print(); }

    function sendWhatsApp() {
        let text = `*ORDER DETAILS*\n*CUSTOMER: ${customerName || 'CASH CUSTOMER'}*\n--------------------------\n`;
        let totalV = 0, totalW = 0;
        
        dataStructure.forEach(group => {
            group.items.forEach(item => {
                const id = item.name.replace(/\s+/g, '-');
                const qty = state[id] || 0;
                if (qty > 0) {
                    const v = qty * item.price, w = qty * item.w;
                    text += `• [${group.cat}] ${item.name} (${item.w}kg)\n  ₦${item.price.toLocaleString()} x ${qty} = ₦${v.toLocaleString()} (${w}kg)\n`;
                    totalV += v; totalW += w;
                }
            });
        });
        
        text += `--------------------------\n*TOTAL WEIGHT:* ${totalW.toLocaleString()}kg\n*TOTAL VALUE:* ₦${totalV.toLocaleString()}\n\n`;
        text += `*BANK DETAILS:*\nSkretting Nigeria Ltd\nFirstbank A/C: 2025573747`;
        window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
    }

    function closeModal() { document.getElementById('reportModal').style.display = 'none'; }
    
    function resetData() { 
        if(confirm("Are you sure you want to completely clear this order sheet layout?")) { 
            state = {}; 
            customerName = ''; 
            localStorage.clear(); 
            init(); 
            closeModal(); 
        } 
    }
    init();
</script>
</body>
</html>
